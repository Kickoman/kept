[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wishlist"
version = "0.1.0"
description = "Kept: a small wishlist service with private share links and bookings hidden from the owner"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pillow>=10.3",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.12",
    "structlog>=24.1,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "playwright>=1.45"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
